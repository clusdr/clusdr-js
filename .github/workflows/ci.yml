name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.73.0"

      - name: Proto pin
        run: |
          make proto PROTO_DIR=/does-not-exist PROTO_REF=main
          git diff --exit-code -- proto/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
